[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmcn"
version = "0.1.0"
description = "GIS-ML-Commodities-Network: satellite activity indices, supply-network theory and regime-conditional price response for energy, agriculture and critical metals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Naomi Tinga" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "hmmlearn>=0.3",
  "ruptures>=1.1",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "requests>=2.31",
  "rasterio>=1.3",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pystac>=1.9",
  "pystac-client>=0.7",
  "planetary-computer>=1.0",
]

[project.optional-dependencies]
earthengine = ["earthengine-api>=0.1.390"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
