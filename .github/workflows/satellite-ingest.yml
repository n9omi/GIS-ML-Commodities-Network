name: satellite-ingest

# Weekly live pull of Sentinel-2 scenes (Planetary Computer needs no key), plus VIIRS Nightfire and
# Sentinel-5P when the matching repository secrets exist. Results are committed back to outputs/.
on:
  schedule:
    - cron: "17 6 * * 1"     # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      module:
        description: "corn | copper | permian | s5p | all"
        default: "all"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e . && pip install earthengine-api
      - name: Live satellite ingestion (resumes from committed CSVs)
        env:
          EOG_USERNAME: ${{ secrets.EOG_USERNAME }}
          EOG_PASSWORD: ${{ secrets.EOG_PASSWORD }}
          EOG_CLIENT_ID: ${{ secrets.EOG_CLIENT_ID }}
          EOG_CLIENT_SECRET: ${{ secrets.EOG_CLIENT_SECRET }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          PC_SDK_SUBSCRIPTION_KEY: ${{ secrets.PC_SDK_SUBSCRIPTION_KEY }}
        run: python pipelines/02_ingest_satellite.py --live --module "${{ github.event.inputs.module || 'all' }}"
      - name: Rebuild features, models and report
        run: bash run.sh
      - name: Commit refreshed outputs
        run: |
          git config user.name "satellite-ingest bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs figures reports
          git diff --cached --quiet || git commit -m "Weekly satellite ingest $(date -u +%F)"
          git push
